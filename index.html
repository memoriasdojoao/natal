<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1f1a">
<title>Amigo Secreto da Família</title>
<style>
:root{--night:#0a1f1a;--pine:#123d30;--line:#2b6a53;--snow:#eef6f1;--mut:#9fc2b3;--red:#c8283a;--gold:#e3b04b}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--snow);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 60% at 50% 0,#14503e 0,var(--night) 70%);padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px;position:relative;z-index:1}
h1,h2,.nm{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:34px;line-height:1.1;margin:8px 0 4px;text-align:center}
.fam{text-align:center;color:var(--gold);margin:0 0 20px;font-weight:600}
h2{font-size:24px;line-height:1.2;margin:0 0 8px}
.card{background:var(--pine);border:1px solid var(--line);border-radius:18px;padding:20px}
.g{text-align:center}
.mut{color:var(--mut)}.small{font-size:14px}.err{color:#ff9aa5;min-height:1.4em;margin:6px 0 0}
input,textarea{width:100%;padding:12px;margin:6px 0;font:16px system-ui,sans-serif;color:var(--snow);background:var(--night);border:1px solid var(--line);border-radius:12px}
button{font:600 16px system-ui,sans-serif;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.btn{width:100%;margin-top:6px;background:var(--red);border-color:var(--red);color:#fff}
.alt{margin:6px 6px 0 0}
.ghost{margin-top:18px;border-color:var(--line);color:var(--mut);font-weight:500;width:100%;height:auto;padding:10px 14px}
.row{border-top:1px solid var(--line);padding:12px 0}
.lk{font-size:13px;color:var(--mut)}
.bt{display:flex;gap:8px}.bt button{flex:1;padding:0 6px}
.box{font-size:120px;line-height:1;border:0;background:none;min-height:140px;animation:wig 2s ease-in-out infinite}
.box.shake{animation:shk .9s}
.nm{font-size:36px;font-weight:700;color:var(--gold);margin:6px 0 12px;word-break:break-word}
#res:not([hidden]){animation:pop .7s}
.sn{position:fixed;top:-2em;color:#fff;opacity:.7;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-8deg)}40%{transform:translateX(14px) rotate(8deg)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.sn{display:none}.box{animation:none}}
</style>
</head>
<body>
<div id="snow"></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pack=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unpack=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
const base=()=>location.href.split('#')[0].split('?')[0];
const HDR='<h1>🎄 Amigo Secreto</h1><p class="fam">Ratochinski, von Linsingen e Grah</p>';
const view=h=>{app.innerHTML=HDR+h};

function guest(p){
  let r;
  try{r=unpack(p);if(typeof r.n!=='string'||typeof r.t!=='string')throw 0}
  catch(e){return view('<div class="card g"><h2>Link incompleto</h2><p class="mut">Peça para quem organizou reenviar o seu link. Ele precisa ser copiado inteiro.</p></div>')}
  view(`<div class="card g"><p class="mut">Ho ho ho!</p><h2>Olá, ${esc(r.n)}!</h2><button class="box" id="box" aria-label="Abrir presente">🎁</button><p id="hint" class="mut">Toque no presente para descobrir quem você tirou</p><div id="res" hidden><p class="mut">Você tirou</p><div class="nm">${esc(r.t)}</div><p>Shhh, é segredo! 🤫</p><p class="mut small">Pode abrir este link em qualquer aparelho: o resultado é sempre o mesmo.</p></div></div>`);
  $('#box').onclick=e=>{const b=e.currentTarget;b.classList.add('shake');setTimeout(()=>{b.style.display='none';$('#hint').hidden=true;$('#res').hidden=false},900)};
}

function form(names=''){
  view(`<div class="card"><h2>Novo sorteio</h2><p class="mut">Digite um nome por linha, com pelo menos 3 pessoas.</p><textarea id="nm" rows="8" placeholder="Maria Ratochinski&#10;João Grah&#10;Ana von Linsingen">${esc(names)}</textarea><button class="btn" id="go">🎲 Fazer o sorteio</button><p id="msg" class="err"></p></div>`);
  $('#go').onclick=()=>{
    const n=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(n.length<3||new Set(n.map(x=>x.toLowerCase())).size<n.length)return $('#msg').textContent='Use pelo menos 3 nomes, sem repetir.';
    const c=shuf(n),m=new Map(c.map((x,i)=>[x,c[(i+1)%c.length]])),R=n.map(x=>({n:x,t:m.get(x)}));
    if(R.some(r=>r.n===r.t)||new Set(R.map(r=>r.t)).size!==n.length)return $('#msg').textContent='Erro no sorteio. Tente de novo.';
    sv('amigo',JSON.stringify(R));list(R);
  };
}

function list(R){
  view(`<div class="card"><h2>Sorteio feito ✔</h2><p class="mut">Envie a cada pessoa o link dela. Cada link já leva o resultado e abre igual em qualquer aparelho.</p>${R.map((r,i)=>`<div class="row"><b>${esc(r.n)}</b><input class="ph" type="tel" inputmode="tel" placeholder="Celular com DDD (opcional)" value="${esc(ld('ph:'+r.n)||'')}"><input class="lk" readonly value="${esc(base()+'#r='+pack(r))}"><div class="bt"><button data-a="wa" data-i="${i}">WhatsApp</button><button data-a="sms" data-i="${i}">SMS</button><button data-a="cp" data-i="${i}">Copiar</button></div></div>`).join('')}<div class="row"><button id="chk" class="alt">✅ Conferir sorteio</button><button id="gab" class="alt">👀 Ver gabarito</button><p id="rep" class="mut"></p></div><button class="ghost" id="redo">Fazer novo sorteio</button></div>`);
  $('#chk').onclick=()=>{
    const L=[...document.querySelectorAll('.lk')].map(i=>{try{return unpack(i.value.split('#r=')[1])}catch(e){return null}});
    const ok=L.every((r,i)=>r&&r.n===R[i].n&&r.t!==r.n&&R.some(x=>x.n===r.t))&&new Set(L.map(r=>r&&r.t)).size===R.length;
    $('#rep').textContent=ok?`✔ ${R.length} pessoas: cada uma tirou exatamente 1 pessoa, ninguém tirou a si mesma e ninguém foi tirado 2 vezes.`:'⚠ Algo está errado: faça um novo sorteio.';
  };
  $('#gab').onclick=e=>{
    if(!e.target.dataset.s){e.target.dataset.s=1;e.target.textContent='Toque de novo: isso estraga a surpresa';return}
    $('#rep').innerHTML=R.map(r=>`${esc(r.n)} → ${esc(r.t)}`).join('<br>');
  };
  $('#redo').onclick=e=>{
    if(e.target.dataset.s){sv('amigo','');return form(R.map(r=>r.n).join('\n'))}
    e.target.dataset.s=1;e.target.textContent='Toque de novo para apagar. Links antigos continuam mostrando o sorteio antigo: se refizer, mande o link novo para TODOS.';
  };
  app.onclick=e=>{
    const b=e.target.closest('button[data-a]');if(!b)return;
    const row=b.closest('.row'),n=R[b.dataset.i].n,lk=row.querySelector('.lk'),ph=row.querySelector('.ph').value;sv('ph:'+n,ph);
    const q=encodeURIComponent(`🎄 Amigo Secreto da família! Oi, ${n}! Toque no seu link pessoal para descobrir quem você tirou (não mostre para ninguém 🤫): ${lk.value}`);
    let d=ph.replace(/\D/g,'');if(d&&d.length<=11)d='55'+d;
    const a=b.dataset.a;
    if(a==='wa')open(`https://wa.me/${d}?text=${q}`,'_blank');
    else if(a==='sms')location.href=`sms:${d?'+'+d:''}${/iPhone|iPad/.test(navigator.userAgent)?'&':'?'}body=${q}`;
    else{lk.select();navigator.clipboard?.writeText(lk.value).then(()=>{b.textContent='Copiado ✔'}).catch(()=>{})}
  };
}

function route(){
  const m=(location.hash.match(/^#r=(.+)$/)||location.search.match(/[?&]r=([^&]+)/)||[])[1];
  if(m)return guest(m);
  const sd=ld('amigo');
  if(sd){try{return list(JSON.parse(sd))}catch(e){}}
  form();
}
addEventListener('hashchange',route);
for(let i=0;i<26;i++){const s=document.createElement('i');s.className='sn';s.textContent='❄';s.style.cssText=`left:${rnd(100)}%;animation-duration:${6+rnd(8)}s;animation-delay:-${rnd(12)}s;font-size:${10+rnd(14)}px`;$('#snow').appendChild(s)}
route();
</script>
</body>
</html>
