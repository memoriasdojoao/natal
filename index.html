<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#cfe4f6">
<title>Amigo Secreto da Família</title>
<style>
:root{--night:#f1f7fc;--pine:#ffffff;--line:#cfe1f0;--snow:#16324a;--mut:#58748a;--red:#c8283a;--gold:#a56c0a}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--snow);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(#cfe4f6 0,#eef6fd 45%,#fff 100%);padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:20px 16px calc(min(100vw,560px)/2 + 28px);position:relative;z-index:1}
#scene{position:fixed;left:50%;bottom:0;width:min(100%,560px);transform:translateX(-50%);z-index:0;pointer-events:none}
h1,h2,.nm{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:34px;line-height:1.1;margin:8px 0 4px;text-align:center;color:var(--red)}
.fam{text-align:center;color:var(--gold);margin:0 0 20px;font-weight:600}
h2{font-size:24px;line-height:1.2;margin:0 0 8px}
.card{background:var(--pine);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(40,90,130,.14)}
.g{text-align:center}
.mut{color:var(--mut)}.small{font-size:14px}.err{color:#b3202f;min-height:1.4em;margin:6px 0 0}
input,textarea{width:100%;padding:12px;margin:6px 0;font:16px system-ui,sans-serif;color:var(--snow);background:var(--night);border:1px solid var(--line);border-radius:12px}
button{font:600 16px system-ui,sans-serif;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.btn{width:100%;margin-top:6px;background:var(--red);border-color:var(--red);color:#fff}
.alt{margin:6px 6px 0 0}
.ghost{margin-top:18px;border-color:var(--line);color:var(--mut);font-weight:500;width:100%;height:auto;padding:10px 14px}
.row{border-top:1px solid var(--line);padding:12px 0}
.lk{font-size:13px;color:var(--mut)}
.bt{display:flex;gap:8px}.bt button{flex:1;padding:0 6px}
.gift{width:170px;height:170px;display:block;margin:6px auto 14px;overflow:visible;animation:wig 2.4s ease-in-out infinite}
.gift.shake{animation:shk .45s infinite}
.lid{transition:transform .6s cubic-bezier(.2,.9,.3,1.3),opacity .6s;transform-box:fill-box;transform-origin:center}
.gift.open{animation:none}.gift.open .lid{transform:translate(34px,-46px) rotate(26deg);opacity:0}
.go{width:100%;min-height:58px;font-size:20px;border:0;color:#2b1a00;background:linear-gradient(180deg,#f3cd78,#d79a2a);box-shadow:0 6px 0 #9a6a14,0 10px 24px rgba(0,0,0,.35)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #9a6a14}
.dots{font:700 24px Georgia,serif;color:var(--gold);margin:8px 0;animation:blink .5s infinite alternate}
.cf{position:fixed;top:-14px;width:9px;height:14px;pointer-events:none;z-index:5;animation:fall linear forwards}
@keyframes blink{to{opacity:.25}}
.nm{font-size:36px;font-weight:700;color:var(--gold);margin:6px 0 12px;word-break:break-word}
#res:not([hidden]){animation:pop .7s}
.sn{position:fixed;top:-2em;color:#9ec5e6;opacity:.95;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-8deg)}40%{transform:translateX(14px) rotate(8deg)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.sn,.cf{display:none}.gift{animation:none}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 200" aria-hidden="true">

<path d="M90 175L190 55 290 175Z" fill="#a3c2de"/><path d="M190 55L169 88 181 82 190 95 200 81 212 89Z" fill="#fff"/>

<g stroke="#bcd3e6" stroke-width="1.5" fill="#fff"><circle cx="55" cy="154" r="17"/><circle cx="55" cy="129" r="13"/><circle cx="55" cy="108" r="10"/></g>
<rect x="46" y="88" width="18" height="12" fill="#2b2b3a"/><rect x="42" y="98" width="26" height="4" rx="2" fill="#2b2b3a"/>
<circle cx="51" cy="107" r="1.3" fill="#222"/><circle cx="59" cy="107" r="1.3" fill="#222"/><path d="M55 110L67 112 55 114Z" fill="#f08a24"/>

<path d="M220 135Q230 142 232 150" stroke="#c8283a" stroke-width="7" stroke-linecap="round" fill="none"/>
<circle cx="200" cy="108" r="11" fill="#f5c9a6"/><path d="M189 108Q200 140 211 108 200 118 189 108Z" fill="#fff"/>
<circle cx="196" cy="105" r="1.2" fill="#222"/><circle cx="204" cy="105" r="1.2" fill="#222"/>
<path d="M188 102Q200 70 214 90L212 102Z" fill="#c8283a"/><rect x="187" y="98" width="26" height="7" rx="3.5" fill="#fff"/><circle cx="215" cy="90" r="4" fill="#fff"/>
<ellipse cx="335" cy="150" rx="22" ry="12" fill="#9b6a3d"/><path d="M319 158V174M327 160V174M345 160V174M352 158V174" stroke="#7a4f2b" stroke-width="4" stroke-linecap="round"/>
<path d="M318 145L308 128" stroke="#9b6a3d" stroke-width="9" stroke-linecap="round"/><ellipse cx="303" cy="126" rx="9" ry="6.5" fill="#9b6a3d" transform="rotate(-20 303 126)"/>
<circle cx="294" cy="129" r="3.2" fill="#e5232d"/><circle cx="302" cy="123" r="1.3" fill="#222"/>
<path d="M304 119L300 104M300 104L293 100M300 104L303 96M308 119L312 105M312 105L319 102M312 105L310 97" stroke="#6b4a2b" stroke-width="2" stroke-linecap="round" fill="none"/>
<path d="M322 141Q335 151 347 141" stroke="#c8283a" stroke-width="3" fill="none"/><circle cx="357" cy="146" r="3" fill="#fff"/>
</svg>
<div id="snow"></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pack=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unpack=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
const base=()=>location.href.split('#')[0].split('?')[0];
const HDR='<h1>🎄 Amigo Secreto</h1><p class="fam">Ratochinski, von Linsingen, Grah, Fagundes e Sousa</p>';
const view=h=>{app.innerHTML=HDR+h};

function suspense(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{navigator.audioSession.type='playback'}catch(e){}
  const c=new AC();if(c.resume)c.resume();
  const T=c.currentTime,D=5.4,g=c.createGain();g.gain.value=.5;g.connect(c.destination);
  const tone=(type,f,t,len,v,f2)=>{const o=c.createOscillator(),e=c.createGain();o.type=type;o.frequency.setValueAtTime(f,T+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+t+len);e.gain.setValueAtTime(.0001,T+t);e.gain.exponentialRampToValueAtTime(v,T+t+.01);e.gain.exponentialRampToValueAtTime(.0001,T+t+len);o.connect(e);e.connect(g);o.start(T+t);o.stop(T+t+len+.05)};
  const o=c.createOscillator(),e=c.createGain(),f=c.createBiquadFilter();
  o.type='sawtooth';o.frequency.setValueAtTime(55,T);o.frequency.exponentialRampToValueAtTime(110,T+D);
  f.type='lowpass';f.frequency.setValueAtTime(200,T);f.frequency.linearRampToValueAtTime(900,T+D);
  e.gain.setValueAtTime(.0001,T);e.gain.linearRampToValueAtTime(.35,T+D);e.gain.linearRampToValueAtTime(.0001,T+D+.15);
  o.connect(f);f.connect(e);e.connect(g);o.start(T);o.stop(T+D+.2);
  const N=[196,196,233.08,196,261.63,196,233.08,196];let t=0,i=0;
  while(t<D){const p=t/D;tone('triangle',N[i%8]*(1+p*.5),t,.09,.5);t+=.34-.26*p;i++}
  tone('sine',65,D,.7,.9,38);
  [523.25,659.25,783.99,1046.5].forEach((q,k)=>tone('triangle',q,D+.05+k*.09,1.2,.35));
  setTimeout(()=>c.close&&c.close(),9500);
}
function confetti(){
  const col=['#c8283a','#e3b04b','#2ea36f','#2b6fb8','#6ec6ff'];
  for(let i=0;i<48;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`left:${rnd(100)}%;background:${col[rnd(5)]};animation-duration:${2+rnd(30)/10}s;animation-delay:${rnd(8)/10}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),6500)}
}
function guest(p){
  let r;
  try{r=unpack(p);if(typeof r.n!=='string'||typeof r.t!=='string')throw 0}
  catch(e){return view('<div class="card g"><h2>Link incompleto</h2><p class="mut">Peça para quem organizou reenviar o seu link. Ele precisa ser copiado inteiro.</p></div>')}
  view(`<div class="card g"><p class="mut">Ho ho ho!</p><h2>Olá, ${esc(r.n)}!</h2><svg id="gift" class="gift" viewBox="0 0 120 120" aria-hidden="true"><rect x="18" y="52" width="84" height="56" rx="6" fill="#c8283a"/><rect x="52" y="52" width="16" height="56" fill="#e3b04b"/><g class="lid"><rect x="12" y="38" width="96" height="20" rx="6" fill="#d8394b"/><rect x="52" y="38" width="16" height="20" fill="#e3b04b"/><path d="M60 38C40 14 20 22 34 36 42 42 56 40 60 38Z" fill="#e3b04b"/><path d="M60 38C80 14 100 22 86 36 78 42 64 40 60 38Z" fill="#e3b04b"/></g></svg><div id="act"><button class="go" id="go">Quem eu tirei?</button><p class="mut small">🔊 Ligue o som para a surpresa completa</p></div><div id="res" hidden><p class="mut">Você tirou</p><div class="nm">${esc(r.t)}</div><p>Shhh, é segredo! 🤫</p><p class="mut small">Este link abre igual em qualquer aparelho: o resultado é sempre o mesmo.</p></div></div>`);
  $('#go').onclick=()=>{
    $('#act').innerHTML='<p class="dots">Quem será…</p>';
    $('#gift').classList.add('shake');
    suspense();
    setTimeout(()=>{const g=$('#gift');g.classList.remove('shake');g.classList.add('open');$('#act').hidden=true;$('#res').hidden=false;confetti()},5400);
  };
}

function form(names=''){
  view(`<div class="card"><h2>Novo sorteio</h2><p class="mut">Digite um nome por linha, com pelo menos 3 pessoas.</p><textarea id="nm" rows="8" placeholder="Maria Ratochinski&#10;João Grah&#10;Ana von Linsingen">${esc(names)}</textarea><button class="btn" id="go">🎲 Fazer o sorteio</button><p id="msg" class="err"></p></div>`);
  $('#go').onclick=()=>{
    const n=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(n.length<3||new Set(n.map(x=>x.toLowerCase())).size<n.length)return $('#msg').textContent='Use pelo menos 3 nomes, sem repetir.';
    const c=shuf(n),m=new Map(c.map((x,i)=>[x,c[(i+1)%c.length]])),R=n.map(x=>({n:x,t:m.get(x)}));
    if(R.some(r=>r.n===r.t)||new Set(R.map(r=>r.t)).size!==n.length)return $('#msg').textContent='Erro no sorteio. Tente de novo.';
    sv('amigo',JSON.stringify(R));list(R);
  };
}

function list(R){
  view(`<div class="card"><h2>Sorteio feito ✔</h2><p class="mut">Envie a cada pessoa o link dela. Cada link já leva o resultado e abre igual em qualquer aparelho.</p>${R.map((r,i)=>`<div class="row"><b>${esc(r.n)}</b><input class="ph" type="tel" inputmode="tel" placeholder="Celular com DDD (opcional)" value="${esc(ld('ph:'+r.n)||'')}"><input class="lk" readonly value="${esc(base()+'#r='+pack(r))}"><div class="bt"><button data-a="wa" data-i="${i}">WhatsApp</button><button data-a="sms" data-i="${i}">SMS</button><button data-a="cp" data-i="${i}">Copiar</button></div></div>`).join('')}<div class="row"><button id="chk" class="alt">✅ Conferir sorteio</button><button id="gab" class="alt">👀 Ver gabarito</button><p id="rep" class="mut"></p></div><button class="ghost" id="redo">Fazer novo sorteio</button></div>`);
  $('#chk').onclick=()=>{
    const L=[...document.querySelectorAll('.lk')].map(i=>{try{return unpack(i.value.split('#r=')[1])}catch(e){return null}});
    const ok=L.every((r,i)=>r&&r.n===R[i].n&&r.t!==r.n&&R.some(x=>x.n===r.t))&&new Set(L.map(r=>r&&r.t)).size===R.length;
    $('#rep').textContent=ok?`✔ ${R.length} pessoas: cada uma tirou exatamente 1 pessoa, ninguém tirou a si mesma e ninguém foi tirado 2 vezes.`:'⚠ Algo está errado: faça um novo sorteio.';
  };
  $('#gab').onclick=e=>{
    if(!e.target.dataset.s){e.target.dataset.s=1;e.target.textContent='Toque de novo: isso estraga a surpresa';return}
    $('#rep').innerHTML=R.map(r=>`${esc(r.n)} → ${esc(r.t)}`).join('<br>');
  };
  $('#redo').onclick=e=>{
    if(e.target.dataset.s){sv('amigo','');return form(R.map(r=>r.n).join('\n'))}
    e.target.dataset.s=1;e.target.textContent='Toque de novo para apagar. Links antigos continuam mostrando o sorteio antigo: se refizer, mande o link novo para TODOS.';
  };
  app.onclick=e=>{
    const b=e.target.closest('button[data-a]');if(!b)return;
    const row=b.closest('.row'),n=R[b.dataset.i].n,lk=row.querySelector('.lk'),ph=row.querySelector('.ph').value;sv('ph:'+n,ph);
    const q=encodeURIComponent(`🎄 Amigo Secreto da família! Oi, ${n}! Toque no seu link pessoal para descobrir quem você tirou (não mostre para ninguém 🤫): ${lk.value}`);
    let d=ph.replace(/\D/g,'');if(d&&d.length<=11)d='55'+d;
    const a=b.dataset.a;
    if(a==='wa')open(`https://wa.me/${d}?text=${q}`,'_blank');
    else if(a==='sms')location.href=`sms:${d?'+'+d:''}${/iPhone|iPad/.test(navigator.userAgent)?'&':'?'}body=${q}`;
    else{lk.select();navigator.clipboard?.writeText(lk.value).then(()=>{b.textContent='Copiado ✔'}).catch(()=>{})}
  };
}

function route(){
  const m=(location.hash.match(/^#r=(.+)$/)||location.search.match(/[?&]r=([^&]+)/)||[])[1];
  if(m)return guest(m);
  const sd=ld('amigo');
  if(sd){try{return list(JSON.parse(sd))}catch(e){}}
  form();
}
addEventListener('hashchange',route);
for(let i=0;i<26;i++){const s=document.createElement('i');s.className='sn';s.textContent='❄';s.style.cssText=`left:${rnd(100)}%;animation-duration:${6+rnd(8)}s;animation-delay:-${rnd(12)}s;font-size:${10+rnd(14)}px`;$('#snow').appendChild(s)}
route();
</script>
</body>
</html>
