<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo Secreto · Ratochinski, Von von Linsingen e Grah</title>
<style>
:root{--bg:#fff6e8;--card:#fff;--tx:#3b1218;--mut:#7a5a5e;--red:#c0252f;--grn:#1f6b45;--bd:#ecd9c4;--sn:#b9cfe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16090c;--card:#2a1218;--tx:#fbeee0;--mut:#c9a9a6;--red:#e0414b;--grn:#3fae78;--bd:#4a2530;--sn:#fff}}
:root[data-theme="dark"]{--bg:#16090c;--card:#2a1218;--tx:#fbeee0;--mut:#c9a9a6;--red:#e0414b;--grn:#3fae78;--bd:#4a2530;--sn:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:16px;position:relative;z-index:1}
header{text-align:center;padding:12px 0}
.tree{font-size:56px}
h1{margin:0;font-size:32px;color:var(--red);font-family:Georgia,serif}
h2{margin:4px 0 8px;font-family:Georgia,serif}
.fam{margin:4px 0 0;color:var(--grn);font-weight:700;font-size:15px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:20px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.mut{color:var(--mut)}.small{font-size:14px}.err{color:var(--red);min-height:1.4em}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font:16px system-ui,sans-serif;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
button{font:600 16px system-ui,sans-serif;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--grn);background:transparent;color:var(--grn);cursor:pointer}
.btn{width:100%;background:var(--red);border-color:var(--red);color:#fff;margin-top:6px}
.ghost{margin-top:18px;border-color:var(--bd);color:var(--mut);font-weight:500}
.row{text-align:left;border-top:1px solid var(--bd);padding:12px 0}
.lk{font-size:13px;color:var(--mut)}
.bt{display:flex;gap:8px}.bt button{flex:1;padding:0 6px}
.box{font-size:120px;line-height:1;border:0;background:none;min-height:140px;animation:wig 2s ease-in-out infinite}
.box.shake{animation:shk .9s}
.nm{font:700 34px Georgia,serif;color:var(--red);margin:6px 0 12px;word-break:break-word}
#res:not([hidden]){animation:pop .7s}
.sn{position:fixed;top:-2em;color:var(--sn);opacity:.75;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px) rotate(-8deg)}40%{transform:translateX(14px) rotate(8deg)}60%{transform:translateX(-10px)}80%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.sn{display:none}.box{animation:none}}
</style>
</head>
<body>
<div id="snow"></div>
<main id="app"></main>
<script type="application/json" id="state">{"salt":"","names":[],"recs":[]}</script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),E=new TextEncoder(),D=new TextDecoder(),sub=crypto.subtle;
let S=JSON.parse($('#state').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=u=>btoa(String.fromCharCode(...u)),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const HDR='<header><div class="tree">🎄</div><h1>Amigo Secreto</h1><p class="fam">Ratochinski · Von von Linsingen · Grah</p></header>';
const view=h=>{app.innerHTML=HDR+h};
const isTok=t=>/^[0-9a-f]{24}$/.test(t);

async function tokenFor(pw,n){const k=await sub.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveBits']);return hex(new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:E.encode(S.salt+':'+n),iterations:150000,hash:'SHA-256'},k,256))).slice(0,24)}
const aes=async t=>sub.importKey('raw',await sub.digest('SHA-256',E.encode(t)),'AES-GCM',false,['encrypt','decrypt']);
async function seal(t,o){const iv=crypto.getRandomValues(new Uint8Array(12));return{i:b64(iv),c:b64(new Uint8Array(await sub.encrypt({name:'AES-GCM',iv},await aes(t),E.encode(JSON.stringify(o)))))}}
async function unseal(t){const k=await aes(t);for(const r of S.recs){try{return JSON.parse(D.decode(await sub.decrypt({name:'AES-GCM',iv:unb(r.i)},k,unb(r.c))))}catch(e){}}return null}

function docFor(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#snow').innerHTML='';c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');return'<!doctype html>\n'+c.outerHTML}
async function publish(){const a=await window.claude?.use('artifact');if(!a)throw Error('só o dono do site consegue salvar o sorteio.');await a.publish(docFor())}

async function draw(names,pw){
  const old=S;
  try{
    S={salt:hex(crypto.getRandomValues(new Uint8Array(8))),names,recs:[]};
    const c=shuf(names),recs=[],got=new Set();
    for(let i=0;i<c.length;i++){const n=c[i],t=c[(i+1)%c.length];if(n===t)throw Error('sorteio inválido');got.add(t);recs.push(await seal(await tokenFor(pw,n),{n,t}))}
    if(got.size!==c.length)throw Error('sorteio inválido');
    S.recs=shuf(recs);
    await publish();
  }catch(e){S=old;throw e}
}

async function guest(t){
  view('<div class="card"><p class="mut">Abrindo seu presente…</p></div>');
  const r=await unseal(t);
  if(!r)return view('<div class="card"><h2>Link não reconhecido</h2><p class="mut">Peça ao organizador para reenviar o seu link pessoal.</p></div>');
  view(`<div class="card"><p class="mut">Ho ho ho!</p><h2>Olá, ${esc(r.n)}!</h2><button class="box" id="box" aria-label="Abrir presente">🎁</button><p id="hint" class="mut">Toque no presente para descobrir quem você tirou</p><div id="res" hidden><p class="mut">Você tirou</p><div class="nm">${esc(r.t)}</div><p>Shhh… é segredo! 🤫</p><p class="mut small">Pode abrir este link em qualquer aparelho: o resultado é sempre o mesmo.</p></div></div>`);
  $('#box').onclick=e=>{const b=e.currentTarget;b.classList.add('shake');setTimeout(()=>{b.style.display='none';$('#hint').hidden=true;$('#res').hidden=false},900)};
}

function adminForm(names=S.names){
  view(`<div class="card"><h2>Novo sorteio</h2><p class="mut">Um nome por linha (mínimo 3). Escolha uma senha de organizador: ela gera os links pessoais e não fica guardada em lugar nenhum, então anote.</p><textarea id="nm" rows="8" placeholder="Maria Ratochinski&#10;João Grah&#10;Ana Von von Linsingen">${esc(names.join('\n'))}</textarea><input id="pw" type="password" placeholder="Senha do organizador" autocomplete="off"><button class="btn" id="go">🎲 Sortear e salvar</button><p id="msg" class="err"></p></div>`);
  $('#go').onclick=async()=>{
    const n=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean),pw=$('#pw').value,m=$('#msg');
    if(n.length<3||new Set(n.map(x=>x.toLowerCase())).size<n.length||pw.length<4)return m.textContent='Use ao menos 3 nomes diferentes e uma senha com 4+ caracteres.';
    m.textContent='Sorteando e salvando…';
    try{await draw(n,pw)}catch(e){m.textContent='Não consegui salvar: '+e.message}
  };
}

function adminDone(){
  view(`<div class="card"><h2>Sorteio feito ✔</h2><p class="mut">${S.names.length} pessoas. Digite a senha para ver os links pessoais e enviar por WhatsApp ou SMS.</p><input id="base" placeholder="Link público do site" value="${esc(ld('base')||location.href.split('#')[0])}"><input id="pw" type="password" placeholder="Senha do organizador" autocomplete="off"><button class="btn" id="go">🔑 Mostrar links</button><p id="msg" class="err"></p><div id="list"></div><button class="ghost" id="redo">Refazer sorteio</button></div>`);
  $('#go').onclick=async()=>{
    const m=$('#msg'),base=$('#base').value.split('#')[0].trim();sv('base',base);m.textContent='Calculando…';
    const L=[];for(const n of S.names)L.push([n,await tokenFor($('#pw').value,n)]);
    if(!(await unseal(L[0][1])))return m.textContent='Senha incorreta.';
    m.textContent='';
    $('#list').innerHTML=L.map(([n,t],i)=>`<div class="row"><b>${esc(n)}</b><input class="ph" type="tel" inputmode="tel" placeholder="Celular com DDD (opcional)" value="${esc(ld('ph:'+n)||'')}"><input class="lk" readonly value="${esc(base+'#'+t)}"><div class="bt"><button data-a="wa" data-i="${i}">WhatsApp</button><button data-a="sms" data-i="${i}">SMS</button><button data-a="cp" data-i="${i}">Copiar</button></div></div>`).join('');
    $('#list').onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      const r=b.closest('.row'),n=L[b.dataset.i][0],lk=r.querySelector('.lk'),ph=r.querySelector('.ph').value;sv('ph:'+n,ph);
      const q=encodeURIComponent(`🎄 Amigo Secreto da família! Oi, ${n}! Toque no seu link pessoal para descobrir quem você tirou (não mostre para ninguém 🤫): ${lk.value}`);
      let d=ph.replace(/\D/g,'');if(d&&d.length<=11)d='55'+d;
      const a=b.dataset.a;
      if(a==='wa')open(`https://wa.me/${d}?text=${q}`,'_blank');
      else if(a==='sms')open(`sms:${d?'+'+d:''}${/iPhone|iPad/.test(navigator.userAgent)?'&':'?'}body=${q}`,'_blank');
      else{lk.select();navigator.clipboard?.writeText(lk.value).then(()=>{b.textContent='Copiado ✔'}).catch(()=>{})}
    };
  };
  $('#redo').onclick=e=>{if(e.target.dataset.s)return adminForm();e.target.dataset.s=1;e.target.textContent='Toque de novo para confirmar (os links atuais só deixam de valer quando você salvar o novo sorteio)'};
}

async function owner(){
  for(let i=0;i<20&&!window.claude;i++)await new Promise(r=>setTimeout(r,150));
  try{const u=await window.claude?.use('user');if(u&&u.isOwner()&&!isTok(location.hash.slice(1)))S.recs.length?adminDone():adminForm()}catch(e){}
}
function route(){
  const t=location.hash.slice(1);
  if(isTok(t))return guest(t);
  view('<div class="card"><h2>Use o seu link pessoal</h2><p class="mut">Cada pessoa da família recebeu um link só dela, pelo WhatsApp ou SMS. Toque nele para abrir o seu presente. 🎁</p></div>');
  owner();
}
addEventListener('hashchange',route);
for(let i=0;i<28;i++){const s=document.createElement('i');s.className='sn';s.textContent='❄';s.style.cssText=`left:${rnd(100)}%;animation-duration:${6+rnd(8)}s;animation-delay:-${rnd(12)}s;font-size:${10+rnd(14)}px`;$('#snow').appendChild(s)}
route();
</script>
</body>
</html>
